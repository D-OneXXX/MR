name: Linux check

# Windows 宿主上 `cargo check` 会跳过所有 `#[cfg(target_os = "linux")]` 块，
# Linux 专属代码的真实编译验证只能在这里完成。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-check:
    name: cargo check + frontend build (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Install WebKitGTK build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # GitHub-hosted ubuntu-22.04 的 azure 镜像偶发卡住；回退到官方 archive。
          if grep -q 'azure.archive.ubuntu.com' /etc/apt/sources.list 2>/dev/null; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list
          fi
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      - name: Version gate
        run: |
          npm run version:check
          npm run test:version

      - name: Governance script tests
        run: npm run test:governance

      - name: QA fixture unit tests
        run: npm run test:fixtures

      - name: Release contract tests
        run: npm run test:release

      # 格式门禁：Rust 代码必须符合 rustfmt（只读检查，不改写工作区）。
      - name: Rust formatting (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Typecheck and build frontend
        run: |
          npx tsc --noEmit
          npm run build

      - name: cargo check (compiles linux cfg blocks)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Backend unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # 集成测试本身不需要窗口，但 WebKitGTK 初始化仍要有 X server；
      # xvfb 保证在无桌面的 runner 上与开发机行为一致。
      - name: Backend integration tests (e2e + memory budget)
        run: |
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml \
            --test e2e_stage1 --test memory_budget

      - name: Release governance rehearsal (no secrets)
        run: node scripts/release-governance/rehearse.mjs

      - name: RustSec audit
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit

      # 直接 zip 已升级 9.1.1；Tauri updater 2.14.0 仍带 zip 4.6.1，
      # 其 extract 仅用于 .zip 更新包，当前 NSIS 通道不触发。
      # 例外必须在内部技术文档（维护者本地维护）记录，不得无理由新增。
      - name: Cargo audit (blocking with documented updater zip exceptions)
        run: |
          cargo audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369

      # 生产依赖漏洞阻断；例外需书面记录。
      - name: NPM audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
