name: Linux check

# Windows 宿主上 `cargo check` 会跳过所有 `#[cfg(target_os = "linux")]` 块，
# Linux 专属代码的真实编译验证只能在这里完成。
on:
  push:
    branches: [feat/linux-port]
  pull_request:
    branches: [feat/linux-port]
  workflow_dispatch:

jobs:
  linux-check:
    name: cargo check + frontend build (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: |
          npx tsc --noEmit
          npm run build

      - name: cargo check (compiles linux cfg blocks)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Backend unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
