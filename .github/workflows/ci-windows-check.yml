name: Windows check

# 主力平台门禁：类型检查、Rust 单测、集成测试、静态 QA 与构建。
# 全量 E2E（WebView2 + CDP）仍由发版工作流在标签构建前执行。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-check:
    name: tsc + cargo test + static QA (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Version gate
        run: |
          npm run version:check
          npm run test:version

      - name: Governance script tests
        run: npm run test:governance

      - name: QA fixture unit tests
        run: npm run test:fixtures

      - name: Release contract tests
        run: npm run test:release

      # 格式门禁：Rust 代码必须符合 rustfmt（只读检查，不改写工作区）。
      - name: Rust formatting (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Backend unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Backend integration tests (e2e + memory budget)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test e2e_stage1 --test memory_budget

      - name: Release governance rehearsal (no secrets)
        run: node scripts/release-governance/rehearse.mjs

      - name: Static and version guards
        run: node tests/qa/run-qa.mjs --suite=static

      # 生产依赖漏洞阻断；例外需书面记录。
      - name: NPM audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
