name: Full QA evidence

# 可复用、可审计的发布候选 QA：按指定 ref 运行，不依赖发布 Tag。
# 失败时仍上传诊断 artifact；不接触 Secrets，不修改 Release。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要验证的来源：分支名 / 标签名 / 完整 40 位 Commit SHA（无法解析时明确失败，不回退默认分支）"
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        description: "要验证的来源：分支名 / 标签名 / 完整 40 位 Commit SHA（无法解析时明确失败，不回退默认分支）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qa-full-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  full-qa:
    name: Full QA evidence (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # 工具链检出：只为拿到解析脚本与 git 远端配置。
      # 真正的证据来源是下面那次「按解析结果检出」的提交。
      - name: Checkout tooling ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # 解析输入的 ref：分支 / 标签 / 完整 Commit SHA。
      # 解析不出来就明确失败——绝不悄悄回退到默认分支（否则报告会带着 main 的
      # 提交冒充用户要的证据）。
      - name: Resolve requested ref
        id: resolve
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          node scripts/release-governance/resolve-qa-ref.mjs "$REQUESTED_REF" --remote origin > "$RUNNER_TEMP/resolved-ref.json"
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/resolved-ref.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `ref=${r.ref}\nkind=${r.kind}\nsha=${r.sha}\n`);
            console.log(`[resolve-qa-ref] 请求 ${r.requested} → ${r.kind} ${r.ref} @ ${r.sha}`);
          '

      - name: Checkout requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          persist-credentials: false

      # 证据里的 head_sha 必须来自**实际检出的提交**，而不是用户输入的字符串。
      - name: Resolve source commit
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          if [ -n "$EXPECTED_SHA" ] && [ "$ACTUAL" != "$EXPECTED_SHA" ]; then
            echo "检出的提交 ${ACTUAL} 与解析出的 ${EXPECTED_SHA} 不一致" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Version gate
        run: |
          npm run version:check
          npm run test:version

      - name: Governance tests
        run: npm run test:governance

      - name: QA fixture unit tests
        run: npm run test:fixtures

      - name: Release contract tests
        run: npm run test:release

      # 格式门禁：Rust 代码必须符合 rustfmt（只读检查，不改写工作区）。
      - name: Rust formatting (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Typecheck and production build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Rust unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Rust integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test e2e_stage1 --test memory_budget

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: NPM audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit

      - name: Cargo audit (blocking with documented exceptions)
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369

      - name: Build QA debug binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Full QA regression (Windows/WebView2)
        shell: pwsh
        timeout-minutes: 45
        run: node tests/qa/run-qa.mjs

      - name: Summarize QA evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### Full QA evidence"
            echo ""
            echo "- Requested ref: \`${{ inputs.ref }}\`（${{ steps.resolve.outputs.kind }}）"
            echo "- Source: \`${{ steps.source.outputs.sha }}\`"
            echo "- Workflow run: ${{ github.run_id }}"
            if [ -f tests/qa/reports/latest.json ]; then
              node -e 'const report=require("./tests/qa/reports/latest.json"); const checks=report.checks||[]; const failed=checks.filter((c)=>c.status==="fail"); const severity={}; for (const c of failed) severity[c.severity||"UNKNOWN"]=(severity[c.severity||"UNKNOWN"]||0)+1; console.log(`- Checks: ${checks.length}`); console.log(`- Failed: ${failed.length}`); console.log(`- Severity: ${JSON.stringify(severity)}`);'
            else
              echo "- QA report: NOT FOUND"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-evidence-${{ steps.source.outputs.sha || github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            tests/qa/reports/latest.md
            tests/qa/reports/latest.json
            tests/qa/artifacts/current/qa-app.log
            tests/qa/artifacts/current/vite.log
            tests/qa/artifacts/current/data/logs/
            tests/qa/artifacts/current/screens/
