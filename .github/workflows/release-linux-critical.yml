name: Release (Linux critical)

# Linux 长期稳定分支的高危补丁通道：仅当推送 v*-linux-sec* 标签
# （如 v0.17.1-linux-sec1）或手动 workflow_dispatch 触发时，才在
# ubuntu-22.04 下编译 deb/rpm/AppImage 并发布 latest-linux-critical.json。
# 日常功能更新不进本通道（Linux 功能扩展由社区非商用修改提供）。
on:
  push:
    tags:
      - "v*-linux-sec*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（必须形如 v0.17.1-linux-sec1，且基础版本与 package.json 一致）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux-critical:
    name: Build signed Linux critical patch
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动 dispatch 时真实发布标签来自 inputs.tag；push 事件回落到触发 ref。
          # 不带 ref 会检出默认分支 HEAD，构建产物与标签指向的提交会对不上。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} on Linux (critical channel)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag base version matches package.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          BASE="$(echo "${{ steps.tag.outputs.tag }}" | sed -E 's/-linux-sec.*//')"
          if [ "v${VERSION}" != "${BASE}" ]; then
            echo "Tag ${{ steps.tag.outputs.tag }} base ${BASE} does not match package.json version v${VERSION}." >&2
            exit 1
          fi

      # 发布门禁：Linux runner 只执行跨平台静态 QA；全量 E2E 使用
      # WebView2/CDP 与 Windows 专属窗口路径，由 Windows 发布通道执行。
      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Rust unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Frontend production build
        run: npm run build

      - name: Static QA regression (platform-independent)
        run: node tests/qa/run-qa.mjs --suite=static

      - name: Build Tauri bundles (deb / rpm / AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 官方构建指纹：关于页/诊断快照显示 Official Release。
          MR_BUILD_ORIGIN: official
        # --config 应用 Linux 平台 overlay：打包目标固定为 deb/rpm/appimage，
        # 并把 updater 端点覆盖为 latest-linux-critical.json。
        # 少了它，Linux 产物会带着 Windows 的 latest.json 端点，更新功能形同虚设。
        run: npm run tauri -- build --config src-tauri/tauri.linux.conf.json --bundles deb,rpm,appimage

      # 构建期硬校验：overlay 端点必须真的进了二进制。
      # 少了 --config 时产物会带 Windows 的 latest.json 端点，
      # Linux 客户端的「检查更新」永远看不到任何东西，而产物本身看不出异常。
      - name: Verify Linux updater endpoint is baked into the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="src-tauri/target/release/manga-reader-tauri"
          if [ ! -f "$BIN" ]; then
            echo "找不到 $BIN，overlay 构建没有产出 release 二进制" >&2
            exit 1
          fi
          if ! grep -a -q "latest-linux-critical.json" "$BIN"; then
            echo "release 二进制里没有 latest-linux-critical.json：平台 overlay 未生效" >&2
            exit 1
          fi
          echo "OK: Linux updater 端点已写入二进制"

      - name: Generate latest-linux-critical.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/make-linux-critical-manifest.mjs

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # 通道清单接力：本次发布可能成为最新 release，必须把 Windows
          # 常规通道的 latest.json 一并带回，否则
          # releases/latest/download/latest.json 会 404。
          mkdir -p channel
          for PREV in $(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name'); do
            if [ "$PREV" = "$RELEASE_TAG" ]; then continue; fi
            if gh release download "$PREV" -p latest.json -D channel --clobber 2>/dev/null; then
              echo "Carrying forward latest.json from ${PREV}"
              break
            fi
          done
          NOTES="Linux channel: high-severity security and crash fixes only; the initial publication of a version line ships the complete build for that version. Routine feature updates are not included."
          # 目标提交必须是本次真正构建的提交（checkout 之后的 HEAD），
          # 不能用 $GITHUB_SHA：手动 dispatch 时它是默认分支 HEAD，与标签不符。
          BUILT_SHA="$(git rev-parse HEAD)"
          echo "Publishing ${RELEASE_TAG} from built commit ${BUILT_SHA}"
          gh release create "$RELEASE_TAG" --target "$BUILT_SHA" \
            --title "MangaReader $RELEASE_TAG (Linux critical)" \
            --notes "$NOTES" || echo "release already exists"
          gh release upload "$RELEASE_TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/latest-linux-critical.json \
            $(ls channel/latest.json 2>/dev/null || true) \
            --clobber
