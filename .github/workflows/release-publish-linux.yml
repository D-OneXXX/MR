name: Publish release (Linux critical)

# Phase 4 正式发布（Linux 高危补丁通道，与 Windows 通道完全独立）。
# 只把**已存在的 Draft** 变成公开 Release，且必须先过人工审批与绑定校验。
#
# 状态模型与 Windows 通道一致：published / need_publish / need_handoff / need_verify
# 由 `scripts/release-governance/publish-state.mjs --channel linux` 判定。
# 已公开但缺 `latest.json` 时，重跑只补清单，不会重新公开、不会动其它资产。
#
# 部分失败恢复：重跑本工作流即可；两条清单齐备前保持红色，不要手工改清单"凑绿"。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "待发布的候选标签（vX.Y.Z-linux-secN）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish-linux-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify binding → publish Draft (Linux)
    runs-on: ubuntu-22.04
    environment: release-linux
    permissions:
      contents: write # 仅用于发布 Draft、接力通道清单与发布后校验
      actions: read # 在线核验干净 Linux 安装证据的 workflow run 来源
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Checkout published tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if printf '%s' "$TAG" | grep -q "rehearsal"; then
            echo "演练标签永远不得发布：$TAG" >&2
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-linux-sec[0-9]+$'; then
            echo "Linux 高危通道标签必须形如 vX.Y.Z-linux-secN：$TAG" >&2
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          BASE="$(printf '%s' "$TAG" | sed -E 's/-linux-sec.*//')"
          if [ "v${VERSION}" != "$BASE" ]; then
            echo "标签 $TAG 的基础版本与 package.json v${VERSION} 不一致" >&2
            exit 1
          fi
          COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "候选 Commit $COMMIT 不在 main 上，拒绝发布" >&2
            exit 1
          fi
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # 发布门禁必须用**当前 main 上的治理脚本**执行，而不是标签提交里的旧副本。
      # 候选身份仍由 tag / commit / 平台 / 每个制品 SHA-256 绑定；门禁脚本的版本
      # 不参与候选身份，且 main 受保护（PR + CI + PR 治理门禁）。
      - name: Use current release-gate tooling from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout FETCH_HEAD -- scripts/
          echo "发布门禁脚本已对齐 main（$(git rev-parse --short FETCH_HEAD)）"

      # ---------- 发布状态 ----------
      # 与 Windows 通道同一条规则：「已公开」与「清单齐全」分开判定。
      # 已公开但缺另一通道清单时，重跑必须继续补清单，而不是幂等跳过。
      - name: Assess publication state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json isDraft,assets > release-state.json 2>/dev/null; then
            echo "找不到 Release $TAG：必须先由 release-candidate-linux 工作流创建 Draft" >&2
            exit 1
          fi
          node scripts/release-governance/publish-state.mjs --channel linux --input release-state.json

      # 同 Windows 通道：这一步是 draft-assets/ 的唯一产出者，必须同时覆盖
      # 「首次公开」与「已公开但缺 latest.json」的重跑，否则下游验签步骤会读到空目录。
      - name: Download Draft assets and verify binding
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          rm -rf draft-assets && mkdir -p draft-assets
          gh release download "$TAG" --dir draft-assets --clobber
          if [ ! -f draft-assets/rc-record.json ]; then
            echo "Draft 缺少 rc-record.json：无法确认制品摘要，拒绝发布" >&2
            exit 1
          fi
          if [ ! -f draft-assets/install-verification.json ]; then
            echo "缺少安装验证回执 install-verification.json：正式发布强制条件未满足，拒绝发布" >&2
            exit 1
          fi
          node scripts/release-governance/verify-draft.mjs \
            --tag "$TAG" \
            --channel linux-critical \
            --commit "$COMMIT" \
            --record draft-assets/rc-record.json \
            --assets-dir draft-assets \
            --attestation draft-assets/install-verification.json \
            --manifest draft-assets/latest-linux-critical.json \
            --platform linux-x86_64

      # ---------- 强制验收：签名验证 + 真实安装/升级验证 ----------
      # 缺少任一证据、证据过期、版本/Commit/制品哈希/平台不一致，全部拒绝发布。
      # 这三步没有开关：不能通过参数、状态文件或跳过 Job 绕过。
      - name: Fetch pinned minisign (official, digest-verified)
        shell: bash
        run: node scripts/release-governance/fetch-minisign.mjs

      - name: Verify candidate artifact signature
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf evidence && mkdir -p evidence
          # 公钥来自仓库当前配置（信任锚点），不是任何外部输入。
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8"));fs.writeFileSync("evidence/configured.pub",Buffer.from(c.plugins.updater.pubkey,"base64"));'
          # 显式唯一解析安装包与签名：0 个或多个都失败并说明原因（不用 ls 的失败语义）。
          INSTALLER="$(node scripts/release-governance/resolve-draft-asset.mjs \
            --dir draft-assets --pattern '*.AppImage' --label 安装包)"
          SIGNATURE="$(node scripts/release-governance/resolve-draft-asset.mjs \
            --dir draft-assets --pattern '*.AppImage.sig' --label 签名文件)"
          node scripts/release-governance/verify-signature.mjs \
            --artifact "$INSTALLER" \
            --signature "$SIGNATURE" \
            --public-key evidence/configured.pub \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --platform linux-x86_64 \
            --out evidence/signature-verification.json

      - name: Verify install evidence provenance (GitHub-hosted Linux)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-governance/verify-provenance.mjs \
            --evidence draft-assets/install-verification.json \
            --expected-workflow .github/workflows/release-install-verify-linux.yml \
            --require-github-actions \
            --out evidence/install-provenance.json

      - name: Verify release evidence (signature + install/upgrade)
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          if [ ! -f draft-assets/install-verification.json ]; then
            echo "缺少 install-verification.json：干净环境的真实安装/升级/数据完整性验证是发布的强制条件" >&2
            exit 1
          fi
          node scripts/release-governance/verify-evidence.mjs \
            --record draft-assets/rc-record.json \
            --assets-dir draft-assets \
            --signature-evidence evidence/signature-verification.json \
            --install-evidence draft-assets/install-verification.json \
            --public-key evidence/configured.pub \
            --channel linux-critical \
            --commit "$COMMIT"
      # ---------- 公开说明门禁 ----------
      # 与 Windows 通道同一条规则：英文完整版在前、简体中文在后、3–5 条更新、
      # 不含内部工程细节。发布的是审批时看到的 Draft 正文，此处校验的就是它。
      - name: Enforce bilingual release notes
        if: steps.state.outputs.need_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > draft-release-notes.md
          node scripts/release-governance/release-notes.mjs --check draft-release-notes.md
          # 更新弹窗显示的是清单里的 notes，不是 Release 正文：单独校验一次。
          # Linux 高危通道的 notes 是单行双语摘要，用 summary 模式。
          gh release download "$TAG" --pattern latest-linux-critical.json --dir pre-publish-notes --clobber
          node scripts/release-governance/release-notes.mjs \
            --check-manifest pre-publish-notes/latest-linux-critical.json --mode summary
      - name: Publish the Draft
        if: steps.state.outputs.need_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --verify-tag --title "Moyu $TAG (Linux critical)"

      - name: Channel hand-off (carry the other channel manifest)
        if: steps.state.outputs.need_handoff == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # 接力只发生在已公开的 Release 上：Draft 阶段补齐由候选流程负责。
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "Release $TAG 仍未公开：拒绝在 Draft 上执行通道接力" >&2
            exit 1
          fi
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'latest.json'; then
            echo "已包含 latest.json"
            exit 0
          fi
          mkdir -p handoff
          # 只从**已公开且非预发布**的 Release 接力另一通道清单：Draft（包括
          # Windows 尚未审批的候选）不可作为来源，否则会把未审批的清单带上
          # 公开 Release，绕过该通道的人工审批。
          for PREV in $(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'); do
            if [ "$PREV" = "$TAG" ]; then continue; fi
            if gh release download "$PREV" -p latest.json -D handoff --clobber 2>/dev/null; then
              gh release upload "$TAG" handoff/latest.json --clobber
              echo "已从 ${PREV} 接力 latest.json"
              if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'latest.json'; then
                echo "接力后仍未见 latest.json" >&2
                exit 1
              fi
              exit 0
            fi
          done
          echo "未找到可接力的 latest.json：Windows 通道清单必须存在，否则公开下载会 404" >&2
          exit 1

      # 最终判据：公开状态 + 两条通道的清单都必须存在且可下载。
      # 不使用 always()：上游失败时跳过，工作流保持红色。
      - name: Post-release verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$IS_DRAFT" != "false" ]; then
            echo "发布后仍是 Draft：发布未生效" >&2
            exit 1
          fi
          rm -rf published && mkdir -p published
          gh release download "$TAG" --dir published --clobber
          node scripts/verify-updater-manifest.mjs published/latest-linux-critical.json \
            --expect-version "$VERSION" \
            --require-platform linux-x86_64
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest-linux-critical.json" -o published/public-manifest.json
          node scripts/verify-updater-manifest.mjs published/public-manifest.json \
            --expect-version "$VERSION" \
            --require-platform linux-x86_64
          # 另一通道的清单也必须在本 Release 里且可从 latest 端点下载。
          # 版本号允许与本通道不同（Windows 通道可能尚未发布同一版本），只校验平台。
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'latest.json'; then
            echo "缺少 latest.json：Windows 更新端点会 404" >&2
            exit 1
          fi
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" -o published/public-peer.json
          node scripts/verify-updater-manifest.mjs published/public-peer.json \
            --require-platform windows-x86_64

      - name: Summarize publication
        if: success()
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          {
            echo "### 发布结果（Linux critical）"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo "- 状态：${{ steps.state.outputs.need_publish == 'true' && '本次公开' || '此前已公开（本次只补齐/复核清单）' }}"
          } >> "$GITHUB_STEP_SUMMARY"
