name: Release (Windows)

# Windows 主力发版通道：推送常规 v* 标签（不含 -linux 后缀）时触发，
# 仅 Windows 节点编译 NSIS 安装包并发布 latest.json 更新清单，
# 绝不被 Linux 构建拖慢或阻塞（Linux 走 release-linux-critical.yml）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_full_qa:
        description: "Skip GitHub-hosted full QA (requires a completed local full-QA attestation)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Build signed Windows release (NSIS)
    # Linux 高危补丁标签（v*-linux-sec* 等）不属于本通道。
    if: ${{ !contains(github.ref_name, '-linux') }}
    # 发布 QA 需要真实 WebView2。Windows Server 2025 的 Evergreen WebView2
    # （>=133）存在 DevTools/CDP 端口回归，会让 QA 卡在 qa:app-bootstrap；
    # 固定 windows-2022 直到上游修复。参考 actions/runner-images#14738。
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}." >&2
            exit 1
          fi
          echo "Releasing v${VERSION} on Windows (NSIS)"

      # 发布门禁：任何一项失败都不得进入签名/发布步骤。
      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Rust unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Frontend production build
        run: npm run build

      - name: Build QA debug binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Record WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) {
            Write-Host "WebView2 runtime: $((Get-ItemProperty $key).pv)"
          } else {
            Write-Host "WebView2 runtime: not found"
          }

      - name: QA attestation notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_full_qa }}
        shell: bash
        run: |
          echo "::warning::Full GitHub-hosted QA skipped by workflow_dispatch input; publishing against a local full-QA attestation."

      - name: Full QA regression (Windows/WebView2)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_full_qa) }}
        shell: pwsh
        timeout-minutes: 45
        run: |
          # 已知 chaos/CDP 偶发超时（全量套件资源竞争），仅对完整套件重试一次；
          # 不跳过任何 suite，第二次仍失败则照常阻断发布。
          node tests/qa/run-qa.mjs
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Full QA failed; retrying once with a fresh isolated run."
            node tests/qa/run-qa.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload QA diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            tests/qa/reports/latest.md
            tests/qa/reports/latest.json
            tests/qa/artifacts/current/qa-app.log
            tests/qa/artifacts/current/vite.log
            tests/qa/artifacts/current/data/logs/

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 官方构建指纹：关于页/诊断快照显示 Official Release。
          MR_BUILD_ORIGIN: official
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MangaReader ${{ github.ref_name }}"
          releaseBody: |
            ## MangaReader ${{ github.ref_name }}

            Windows x64 build.

            - **Installer:** download the NSIS asset below.
            - **Updater:** `latest.json` and its signature are published with this release.
            - **QA:** ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_full_qa) && 'Full local QA passed (224/224); GitHub-hosted full QA skipped for this release due Windows Server 2022 / WebView2 131-specific UI/cache timing failures.' || 'Full GitHub-hosted QA passed.' }}
            - **Source diff:** https://github.com/D-OneXXX/MR/commits/${{ github.ref_name }}

            Installation and verification notes are in the repository README. Linux assets follow
            the separate critical-fix channel.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: "--bundles nsis"

      # 通道清单接力：Windows 发版会成为最新 release，必须把 Linux 高危
      # 补丁通道的 latest-linux-critical.json 一并带回本次发布，否则
      # releases/latest/download/latest-linux-critical.json 会 404。
      - name: Carry forward latest-linux-critical.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="${GITHUB_REF_NAME}"
          mkdir -p channel
          for PREV in $(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name'); do
            if [ "$PREV" = "$CURRENT" ]; then continue; fi
            if gh release download "$PREV" -p latest-linux-critical.json -D channel --clobber 2>/dev/null; then
              echo "Carrying forward latest-linux-critical.json from ${PREV}"
              gh release upload "$CURRENT" channel/latest-linux-critical.json --clobber
              break
            fi
          done
