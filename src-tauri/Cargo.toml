[package]
name = "manga-reader-tauri"
version = "0.1.0"
description = "Local-first manga reader (Tauri 2 + React)"
authors = ["manga-reader"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "manga_reader_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# 条漫长图：IDCT 缩放解码（>8000px 高的 JPEG 按显示宽度解码，全分辨率栅格不进内存）
jpeg-decoder = "0.3"
lru = "0.12"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
sysinfo = "0.31"
dirs = "5"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 在线源：同步阻塞 HTTP + URL 规范化 + 文件名解码
url = "2"
percent-encoding = "2"
ureq = { version = "2", features = ["json", "socks-proxy"] }

# 阶段三:本地 OCR 走 WinRT Windows.Media.Ocr(仅 Windows)。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_Com",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
